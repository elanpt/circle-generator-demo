<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>Circle Generator</title>
  <style>
    :root {
      color-scheme: dark;
      background: #000000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000000;
      user-select: none;
      touch-action: manipulation;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #000000;
    }

    #app[data-state="welcome"] {
      cursor: auto;
    }

    #app:not([data-state="welcome"]) {
      cursor: none;
    }

    #startButton {
      appearance: none;
      border: 0.14vmin solid #444444;
      border-radius: 0.7vmin;
      padding: 2.2vh 5.8vw;
      background: transparent;
      color: #444444;
      font: 700 4.5vmin/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    #startButton:focus-visible {
      outline: 0.22vmin solid #444444;
      outline-offset: 0.8vmin;
    }

    #hud {
      position: fixed;
      top: 2vh;
      right: 3vw;
      z-index: 3;
      color: #444444;
      font: 600 2.2vmin/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      opacity: 0.82;
      pointer-events: none;
    }

    #circle {
      position: fixed;
      z-index: 1;
      display: none;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 0;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: none;
      align-items: center;
      justify-content: center;
      color: #333333;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 800;
      line-height: 0.9;
      text-align: center;
      letter-spacing: 0;
      pointer-events: none;
    }

    #app[data-state="countdown"] #overlay {
      display: flex;
      font-size: 72vh;
    }

    #app[data-state="paused"] #overlay {
      display: flex;
      font-size: 20vh;
      animation: pausedPulse 4s ease-in-out infinite;
    }

    @keyframes pausedPulse {
      0%,
      100% {
        opacity: 0.2;
      }

      50% {
        opacity: 0.6;
      }
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main id="app" data-state="welcome" aria-live="off">
    <button id="startButton" type="button">START</button>
    <div id="hud" hidden>Circles: 0</div>
    <div id="circle" aria-hidden="true"></div>
    <div id="overlay" aria-hidden="true"></div>
  </main>

  <script>
    (() => {
      const CIRCLES = {
        small: {
          diameterVw: 3.5,
          minDuration: 1500,
          maxDuration: 1700,
          color: '#C49A6C',
        },
        large: {
          diameterVw: 9,
          minDuration: 1000,
          maxDuration: 1200,
          color: '#D16B3D',
        },
      };

      const SAFE_ZONE_PERCENT = 10;
      const MIN_CIRCLE_DISTANCE_WIDTH = 0.25;
      const TRANSITION_GAP_MS = 300;
      const COUNTDOWN_START = 4;
      const COUNTDOWN_STEP_MS = 1000;
      const CIRCLES_PER_SEQUENCE = 5;

      const app = document.getElementById('app');
      const startButton = document.getElementById('startButton');
      const hud = document.getElementById('hud');
      const circle = document.getElementById('circle');
      const overlay = document.getElementById('overlay');

      let started = false;
      let isPaused = false;
      let circles = 0;
      let sequenceCircles = 0;
      let activeTimer = null;
      let previousPosition = null;
      let wakeLock = null;
      let lastPointerToggleTime = 0;

      const randomBetween = (min, max) => min + Math.random() * (max - min);

      const setState = (state) => {
        app.dataset.state = state;
      };

      const updateHud = () => {
        hud.textContent = `Circles: ${circles}`;
      };

      const clearActiveTimer = () => {
        if (activeTimer !== null) {
          window.clearTimeout(activeTimer);
          activeTimer = null;
        }
      };

      const schedule = (callback, delay) => {
        clearActiveTimer();
        activeTimer = window.setTimeout(() => {
          activeTimer = null;
          callback();
        }, delay);
      };

      const hideCircle = () => {
        circle.style.display = 'none';
      };

      const clearOverlay = () => {
        overlay.textContent = '';
      };

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

      const attemptFullscreen = () => {
        const root = document.documentElement;
        const request = root.requestFullscreen || root.webkitRequestFullscreen;

        if (request && !document.fullscreenElement && !document.webkitFullscreenElement) {
          try {
            const result = request.call(root);

            if (result && typeof result.catch === 'function') {
              result.catch(() => {});
            }
          } catch {}
        }
      };

      const requestWakeLock = async () => {
        if (!('wakeLock' in navigator) || wakeLock) {
          return;
        }

        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
          });
        } catch {
          wakeLock = null;
        }
      };

      const selectCircleType = () => (Math.random() < 0.7 ? CIRCLES.small : CIRCLES.large);

      const getCirclePosition = (diameterVw) => {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const radiusVw = diameterVw / 2;
        const radiusVh = (diameterVw * viewportWidth / viewportHeight) / 2;
        const minX = SAFE_ZONE_PERCENT + radiusVw;
        const maxX = 100 - SAFE_ZONE_PERCENT - radiusVw;
        const minY = SAFE_ZONE_PERCENT + radiusVh;
        const maxY = 100 - SAFE_ZONE_PERCENT - radiusVh;
        const minDistance = viewportWidth * MIN_CIRCLE_DISTANCE_WIDTH;

        for (let attempt = 0; attempt < 250; attempt += 1) {
          const next = {
            xVw: randomBetween(minX, maxX),
            yVh: randomBetween(minY, maxY),
          };

          if (!previousPosition) {
            return next;
          }

          const dx = (next.xVw - previousPosition.xVw) * viewportWidth / 100;
          const dy = (next.yVh - previousPosition.yVh) * viewportHeight / 100;
          const distance = Math.hypot(dx, dy);

          if (distance >= minDistance) {
            return next;
          }
        }

        if (!previousPosition) {
          return {
            xVw: randomBetween(minX, maxX),
            yVh: randomBetween(minY, maxY),
          };
        }

        return {
          xVw: clamp(100 - previousPosition.xVw, minX, maxX),
          yVh: clamp(100 - previousPosition.yVh, minY, maxY),
        };
      };

      const startCountdown = () => {
        clearActiveTimer();
        hideCircle();
        setState('countdown');

        let current = COUNTDOWN_START;

        const tick = () => {
          if (isPaused) {
            return;
          }

          if (current === 0) {
            clearOverlay();
            sequenceCircles = 0;
            showNextCircle();
            return;
          }

          overlay.textContent = current;
          current -= 1;
          schedule(tick, COUNTDOWN_STEP_MS);
        };

        tick();
      };

      const startGap = () => {
        hideCircle();
        clearOverlay();
        setState('gap');
        schedule(showNextCircle, TRANSITION_GAP_MS);
      };

      const finishCircle = () => {
        hideCircle();

        if (sequenceCircles >= CIRCLES_PER_SEQUENCE) {
          startCountdown();
          return;
        }

        startGap();
      };

      const showNextCircle = () => {
        if (isPaused) {
          return;
        }

        const nextCircle = selectCircleType();
        const position = getCirclePosition(nextCircle.diameterVw);
        const duration = randomBetween(nextCircle.minDuration, nextCircle.maxDuration);

        setState('circle');
        clearOverlay();
        circle.style.width = `${nextCircle.diameterVw}vw`;
        circle.style.height = `${nextCircle.diameterVw}vw`;
        circle.style.left = `${position.xVw}vw`;
        circle.style.top = `${position.yVh}vh`;
        circle.style.background = nextCircle.color;
        circle.style.display = 'block';

        previousPosition = position;
        circles += 1;
        sequenceCircles += 1;
        updateHud();
        schedule(finishCircle, duration);
      };

      const pauseSession = () => {
        isPaused = true;
        clearActiveTimer();
        hideCircle();
        overlay.textContent = 'PAUSED';
        setState('paused');
      };

      const resumeSession = () => {
        isPaused = false;
        sequenceCircles = 0;
        startCountdown();
      };

      const togglePauseState = () => {
        if (!started) {
          return;
        }

        if (isPaused) {
          resumeSession();
          return;
        }

        pauseSession();
      };

      const handleGlobalPointer = () => {
        lastPointerToggleTime = performance.now();
        togglePauseState();
      };

      const handleGlobalClick = () => {
        if (performance.now() - lastPointerToggleTime < 450) {
          return;
        }

        togglePauseState();
      };

      const startSession = (event) => {
        event.preventDefault();
        event.stopPropagation();

        if (started) {
          return;
        }

        started = true;
        isPaused = false;
        startButton.hidden = true;
        hud.hidden = false;
        updateHud();
        attemptFullscreen();
        void requestWakeLock();
        startCountdown();
      };

      startButton.addEventListener('pointerup', startSession);
      startButton.addEventListener('click', startSession);
      document.addEventListener('pointerup', handleGlobalPointer);
      document.addEventListener('click', handleGlobalClick);

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && started) {
          void requestWakeLock();
        }
      });
    })();
  </script>
</body>
</html>
